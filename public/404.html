  <title>Mohamed Mustafa | Portfolio</title>

    var path = window.location.pathname.replace(/^\/MoMustafa/, '');
    if (path.startsWith('/')) {
      path = path.substring(1);
    }
    var target = '/MoMustafa/#' + (path ? '/' + path : '/') + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
